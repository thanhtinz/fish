apply plugin: 'java'
apply plugin: 'application'

sourceSets.main.resources.srcDirs = ["$rootDir/assets".toString()]
mainClassName = 'com.vancan.autofishing.lwjgl3.DesktopLauncher'
application.mainClass = mainClassName
eclipse.project.name = appName + '-lwjgl3'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

/** Runnable fat jar for local distribution of the development build. */
jar {
    archiveBaseName = appName
    manifest { attributes 'Main-Class': mainClassName }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The `from` closure is lazy, so without this the task has no declared dependency on the
    // jars it unpacks and a clean build fails with ':core' having produced nothing yet.
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
