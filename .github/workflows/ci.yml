name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all

  jvm:
    name: JVM round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The fixtures are committed, but regenerating them here catches the case where they have
      # drifted from the source they are supposed to have been compiled from.
      - name: Regenerate the fixtures
        run: ./tools/make-fixtures.sh

      - name: The fixtures must match what is committed
        run: git diff --exit-code -- crates/tjlocalizer-core/tests/data

      # The point of these two: a patched class that parses proves nothing. Only the JVM's
      # verifier proves the constant pool rewrite is correct.
      - run: ./tools/verify-roundtrip.sh
      - run: ./tools/verify-cli.sh
