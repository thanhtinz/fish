name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # The desktop crate links against the system webview; without these the whole workspace
      # fails to configure, not just that crate.
      - name: Install the desktop shell's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Tauri embeds the built interface into the binary, so the desktop crate does not compile
      # until the frontend exists - and the built files are not in version control. Without this
      # the whole workspace fails to build here, not just that crate.
      - name: Build the desktop interface
        run: npm ci && npm run build
        working-directory: desktop

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all

  ui:
    name: Desktop interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      # The build script typechecks first, so a type error fails here rather than shipping.
      - run: npm run build
        working-directory: desktop

  desktop:
    name: Desktop application starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Xvfb and friends are for the smoke test: it boots the real binary and looks at the window.
      - name: Install the system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb x11-apps xdotool imagemagick

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
        working-directory: desktop

      # Catches what compiling cannot: a missing library, a bad Tauri config, or assets that were
      # not embedded, all of which produce a binary that builds and then will not open.
      - run: ./tools/verify-desktop.sh

  jvm:
    name: JVM round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The fixtures are committed, but regenerating them here catches the case where they have
      # drifted from the source they are supposed to have been compiled from.
      - name: Regenerate the fixtures
        run: ./tools/make-fixtures.sh

      - name: The fixtures must match what is committed
        run: git diff --exit-code -- crates/tjlocalizer-core/tests/data

      # The point of these two: a patched class that parses proves nothing. Only the JVM's
      # verifier proves the constant pool rewrite is correct.
      - run: ./tools/verify-roundtrip.sh
      - run: ./tools/verify-cli.sh
