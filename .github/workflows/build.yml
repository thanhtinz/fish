name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: Core tests and balance guard-rails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :core:test --no-daemon

      # Printed on every run so a tuning change shows its effect in the log, even when the
      # guard-rails still pass.
      - name: Balance report
        run: ./gradlew :core:balanceReport --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: core/build/reports/tests/test

  html:
    name: HTML5 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: GWT compile
        run: ./gradlew :html:dist --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: html5-build
          path: html/build/dist

  screenshots:
    name: UI screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglu1-mesa

      # Renders every screen of the real game. Layout regressions are invisible to unit tests,
      # so the images are attached to the run for review.
      - name: Capture screens
        run: |
          mkdir -p build/screenshots
          xvfb-run -a -s "-screen 0 1080x1920x24" \
            ./gradlew :lwjgl3:run --no-daemon --args="--screenshot $PWD/build/screenshots"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
