buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath "com.android.tools.build:gradle:$androidPluginVersion" }
}

apply plugin: 'com.android.application'

repositories {
    // Declared here rather than for every project: Gradle treats a 403 from a repository as an
    // error instead of "not found", so on networks that reject dl.google.com a global
    // declaration breaks resolution of artifacts Maven Central serves fine.
    google()
    mavenCentral()
}

android {
    namespace project.appPackage
    compileSdk 35
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = ["$rootDir/assets"]
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId project.appPackage
        minSdk 21
        targetSdk 35
        versionCode project.appVersionCode.toInteger()
        versionName project.appVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES',
                               'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

// Declared before the dependencies block that uses it. Gradle adds the `natives(...)` method to
// the dependency handler only when the configuration already exists, so declaring it afterwards
// fails the whole build with "Could not find method natives()" - and because a broken subproject
// script fails configuration for every project, that took the core tests down with it.
configurations {
    natives
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

/** Unpacks the platform .so files libGDX needs into the jniLibs source set. */
tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a/').mkdirs()
        file('libs/arm64-v8a/').mkdirs()
        file('libs/x86/').mkdirs()
        file('libs/x86_64/').mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }
        .configureEach { it.dependsOn 'copyAndroidNatives' }
