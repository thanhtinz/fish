[workspace]
resolver = "2"
members = [
    "crates/tjlocalizer-core",
    "crates/tjlocalizer-cli",
    "crates/tjlocalizer-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Thanhtinz"]
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
